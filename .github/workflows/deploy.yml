name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to deploy
        required: false
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_REF: ${{ github.event.inputs.ref || github.sha }}
      HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
      GOOGLE_SPEECH_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SPEECH_SERVICE_ACCOUNT_JSON_B64 }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add deploy host to known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Install Google Speech credentials on droplet
        if: ${{ env.GOOGLE_SPEECH_SERVICE_ACCOUNT_JSON_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${GOOGLE_SPEECH_SERVICE_ACCOUNT_JSON_B64}" | \
            ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "mkdir -p '${DEPLOY_PATH}/secrets' && base64 -d > '${DEPLOY_PATH}/secrets/google-speech-service-account.json' && chmod 600 '${DEPLOY_PATH}/secrets/google-speech-service-account.json'"

      - name: Deploy exact ref on droplet
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && BRANCH=main REF='${DEPLOY_REF}' bash ./deploy/scripts/deploy-ref.sh"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HEALTHCHECK_URL:-}" ]]; then
            curl --fail --silent --show-error "${HEALTHCHECK_URL}"
          else
            curl --fail --silent --show-error "https://${DEPLOY_HOST}/health"
          fi
